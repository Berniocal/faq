<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#151b2f">
<title>Vedátor – chytré hledání</title>
<link rel="stylesheet" href="app.css">
<script src="theme.js"></script>
</head>
<body>
<header>
  <div class="wrap header-row">
    <div class="header-title">
      <div class="eyebrow">Neoficiální tematický katalog</div>
      <h1 id="heading">Vedátorský podcast – chytré hledání</h1>
    </div>
    <div class="header-actions">
      <div class="language" role="group" aria-label="Jazyk aplikace">
        <button type="button" data-lang="sk">SK</button>
        <button type="button" data-lang="cz">CZ</button>
      </div>
      <button id="theme" class="theme-toggle" type="button" title="Tmavý režim">☾</button>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="panel">
    <div class="search-row">
      <div class="search-wrap">
        <input id="search" class="search" type="search" autocomplete="off"
          placeholder="Zadej pojem nebo otázku a potvrď Enterem…">
        <button id="clear" class="clear" type="button" aria-label="Smazat vyhledávání">×</button>
      </div>
      <button id="searchButton" class="search-button" type="button">Hledat</button>
    </div>

    <div class="tabs" aria-label="Typ výsledků">
      <button class="tab active" data-filter="all" type="button">Vše</button>
      <button class="tab" data-filter="question" type="button">Otázky</button>
      <button class="tab" data-filter="nonquestion" type="button">Neotázky</button>
    </div>

    <div class="suggestions" id="suggestions">
      <button class="suggestion" type="button">foton</button>
      <button class="suggestion" type="button">černá díra</button>
      <button class="suggestion" type="button">kolik váží Slunce</button>
      <button class="suggestion" type="button">jak dlouho cesta na Mars</button>
      <button class="suggestion" type="button">gravitace</button>
      <button class="suggestion" type="button">umělá inteligence</button>
    </div>
  </section>

  <div class="status-row">
    <div id="status">Načítám data Vedatoru…</div>
    <div id="count"></div>
  </div>

  <section id="results" class="grid"></section>
  <button id="more" class="load-more hidden" type="button">Zobrazit další</button>
</main>

<audio id="audio" preload="metadata" playsinline></audio>
<section id="player" class="player-shell hidden" aria-label="Přehrávač">
  <div class="player-inner">
    <div>
      <div id="playerTitle" class="player-title">Vedátorský podcast</div>
      <div id="playerSub" class="player-sub"></div>
    </div>
    <div class="player-controls">
      <button id="back10" type="button">−10 s</button>
      <button id="playPause" class="play-toggle" type="button">Přehrát</button>
      <button id="forward10" type="button">+10 s</button>
      <button id="closePlayer" type="button" title="Sbalit">↓</button>
    </div>
    <div class="player-seek-row">
      <span id="current">0:00</span>
      <input id="seek" class="player-seek" type="range" min="0" max="1" value="0" step="1">
      <span id="duration">–:––</span>
    </div>
  </div>
</section>

<script src="synonyms.js"></script>
<script src="app-core.js"></script>
<script src="app-ui.js"></script>
</body>
</html>
